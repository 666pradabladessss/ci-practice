name: Deploy Test
on:
  workflow_dispatch:
jobs:
  deploy:
    runs-on: [self-hosted, deploy]
    steps:
      - name: Check runner
        run: |
          echo "Hello from self-hosted runner!"
          whoami
          hostname
          pwd
      - name: Check Docker environment
        run: |
          docker version
          docker compose version
          docker compose -f /opt/ci-app/compose.yaml config --quiet
