name: First CI Pipeline
on:
  push:
permissions:
  contents: read
  packages: write
env:
  APP_ENV: production
  APP_NAME: ci-app
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Check Bash syntax
        run: bash -n ci.sh
      - name: Run ShellCheck
        run: shellcheck ci.sh backup.sh deploy.sh
      - name: Run CI checks
        run: bash ./ci.sh
      - name: Build Docker Image
        run: docker build -t ghcr.io/666pradabladessss/ci-app:${GITHUB_SHA::7} .
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push Docker Image
        run: docker push ghcr.io/666pradabladessss/ci-app:${GITHUB_SHA::7}
      - name: Say hello
        run: echo "Hello from GitHub Actions"
      - name: Show directory
        run: pwd
      - name: Check Git
        run: git version
      - name: Show environment
        run: echo "$APP_ENV $APP_NAME"
      - name: Check API key
        env:
          TEST_API_KEY: ${{ secrets.TEST_API_KEY }}
        run: |
          if [ -n "$TEST_API_KEY" ]; then
            echo "API key is configured"
          else
            echo "API key is missing"
            exit 1
          fi
  deploy:
    needs: check
    runs-on: [self-hosted, deploy]
    steps:
      - name: Deploy application
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE_TAG="${IMAGE_TAG:0:7}"
          echo "Deploying image tag: $IMAGE_TAG"
          IMAGE_TAG="$IMAGE_TAG" docker compose -f /opt/ci-app/compose.yaml config --quiet
          IMAGE_TAG="$IMAGE_TAG" docker compose -f /opt/ci-app/compose.yaml up -d --pull always
          docker inspect ci-app --format '{{.Config.Image}}'
          docker inspect ci-app --format '{{.State.ExitCode}}'
          docker logs ci-app
